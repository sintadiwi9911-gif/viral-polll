<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViralWave Agency</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PROGRESS BAR -->
<div id="progress"></div>

<header id="navbar">
    <h1>ViralWave</h1>

    <div class="menu-toggle" id="menu-toggle">☰</div>

    <nav id="nav">
        <a href="#home">Home</a>
        <a href="#services">Layanan</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Kontak</a>
    </nav>

    <button id="darkToggle">🌙</button>
</header>

<section id="home" class="reveal">
    <div class="hero">
        <h2>Make Your Brand Go Viral 🚀</h2>
        <p>Strategi konten kreatif untuk bisnis modern</p>
        <a class="btn" href="#contact">Mulai Sekarang</a>
    </div>
</section>

<section id="services" class="reveal">
    <h2>Layanan</h2>
    <div class="container">
        <div class="card">Social Media</div>
        <div class="card">Content Creator</div>
        <div class="card">Ads Marketing</div>
    </div>
</section>

<section id="portfolio" class="reveal">
    <h2>Portfolio</h2>
    <div class="container">
        <div class="card img">
            <img src="https://source.unsplash.com/300x200/?fashion" />
        </div>
        <div class="card img">
            <img src="https://source.unsplash.com/300x200/?food" />
        </div>
        <div class="card img">
            <img src="https://source.unsplash.com/300x200/?branding" />
        </div>
    </div>
</section>

<section id="contact" class="reveal">
    <h2>Kontak</h2>
    <form>
        <input type="text" placeholder="Nama">
        <input type="email" placeholder="Email">
        <textarea placeholder="Pesan"></textarea>
        <button>Kirim</button>
    </form>

    <!-- WHATSAPP BUTTON -->
    <a class="wa" href="https://wa.me/6281234567890" target="_blank">Chat WhatsApp</a>
</section>

<footer>
    <p>© 2026 ViralWave Agency</p>
</footer>

<script src="script.js"></script>
</body>
</html>
